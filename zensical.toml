[project]
site_name = "GraphReFly Python"
site_description = "Python host package for GraphReFly over the native Rust graph engine."
site_url = "https://graphrefly.dev/py/"
repo_url = "https://github.com/graphrefly/graphrefly-py"
repo_name = "graphrefly/graphrefly-py"
docs_dir = "docs"
site_dir = "site"
nav = [
  { "Overview" = "index.md" },
  { "Quick Start" = "quickstart.md" },
  { "API Reference" = "api.md" },
  { "Release" = "release.md" },
]

[project.theme]
features = [
  "navigation.sections",
  "navigation.instant",
  "content.code.copy",
]

[project.markdown_extensions.admonition]

[project.markdown_extensions.pymdownx.superfences]

[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true

[project.markdown_extensions.pymdownx.inlinehilite]

[project.markdown_extensions.pymdownx.snippets]

[project.plugins.mkdocstrings.handlers.python]
paths = ["src"]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "google"
filters = ["!^_"]
heading_level = 2
members_order = "source"
show_bases = false
show_root_heading = true
show_source = false
show_symbol_type_heading = true
show_symbol_type_toc = true
