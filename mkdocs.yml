site_name: GraphReFly Python
site_description: Python host package for GraphReFly over the native Rust graph engine.
site_url: https://graphrefly.dev/py/
repo_url: https://github.com/graphrefly/graphrefly-py
repo_name: graphrefly/graphrefly-py

theme:
  name: material
  features:
    - navigation.sections
    - navigation.instant
    - content.code.copy

nav:
  - Overview: index.md
  - Quick Start: quickstart.md
  - API Reference: api.md
  - Release: release.md

markdown_extensions:
  - admonition
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            filters:
              - "!^_"
            heading_level: 2
            members_order: source
            show_bases: false
            show_root_heading: true
            show_source: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true

strict: true
