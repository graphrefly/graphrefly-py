name: Deploy docs to GitHub Pages

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: python-pages-${{ github.ref }}
  cancel-in-progress: false

env:
  PY_DOCS_CUSTOM_DOMAIN: py.graphrefly.dev

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Python host package
        uses: actions/checkout@v5
        with:
          path: graphrefly-py

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Enable Corepack (pnpm)
        working-directory: graphrefly-py/website
        run: |
          corepack enable
          corepack install

      - name: Install Python docs dependencies
        working-directory: graphrefly-py
        run: uv sync --group dev --group docs

      - name: Install docs website dependencies
        working-directory: graphrefly-py/website
        run: pnpm install --frozen-lockfile

      - name: API docs coverage
        working-directory: graphrefly-py
        run: uv run python scripts/check_api_docs.py

      - name: Generated docs freshness
        working-directory: graphrefly-py/website
        run: pnpm docs:gen:check

      - name: Build site
        working-directory: graphrefly-py/website
        run: pnpm build

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: graphrefly-py/website/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
