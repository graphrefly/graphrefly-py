name: Deploy docs to GitHub Pages

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: python-pages-${{ github.ref }}
  cancel-in-progress: false

env:
  PY_DOCS_CUSTOM_DOMAIN: py.graphrefly.dev

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Python host package
        uses: actions/checkout@v5
        with:
          path: graphrefly-py

      - name: Checkout Rust native engine
        uses: actions/checkout@v5
        with:
          repository: graphrefly/graphrefly-rs
          ref: main
          path: graphrefly-rs

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies and native extension
        working-directory: graphrefly-py
        run: |
          uv sync --group dev --group docs
          uv run maturin develop --release

      - name: API docs coverage
        working-directory: graphrefly-py
        run: uv run python scripts/check_api_docs.py

      - name: Build site
        working-directory: graphrefly-py
        run: |
          uv run zensical build --strict
          printf '%s\n' "$PY_DOCS_CUSTOM_DOMAIN" > site/CNAME

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: graphrefly-py/site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
