name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Python host package
        uses: actions/checkout@v5
        with:
          path: graphrefly-py

      - name: Checkout Rust native engine
        uses: actions/checkout@v5
        with:
          repository: graphrefly/graphrefly-rs
          ref: main
          path: graphrefly-rs

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies and native extension
        working-directory: graphrefly-py
        run: |
          uv sync --group dev --group docs
          uv run maturin develop --release

      - name: Build site
        working-directory: graphrefly-py
        run: |
          uv run mkdocs build --strict
          mkdir -p public/py
          cp -R site/. public/py/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: graphrefly-py/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
