name: CI

on:
  pull_request:
  push:
    branches: [clean-slate, main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Python host package
        uses: actions/checkout@v5
        with:
          path: graphrefly-py

      - name: Checkout Rust native engine
        uses: actions/checkout@v5
        with:
          repository: graphrefly/graphrefly-rs
          ref: main
          path: graphrefly-rs

      - name: Checkout authority fixtures
        uses: actions/checkout@v5
        with:
          repository: graphrefly/graphrefly
          ref: main
          path: graphrefly

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Enable Corepack (pnpm)
        working-directory: graphrefly-py/website
        run: |
          corepack enable
          corepack install

      - name: Sync dependencies
        working-directory: graphrefly-py
        run: uv sync --group dev --group docs

      - name: Install docs website dependencies
        working-directory: graphrefly-py/website
        run: pnpm install --frozen-lockfile

      - name: Build native extension
        working-directory: graphrefly-py
        run: uv run maturin develop --release

      - name: Test
        working-directory: graphrefly-py
        run: uv run pytest

      - name: Test optional async runtime adapters
        working-directory: graphrefly-py
        run: uv run --with 'trio>=0.25' --with 'anyio>=4.0' pytest tests/test_async_runner_real_runtime.py

      - name: Lint
        working-directory: graphrefly-py
        run: uv run ruff check .

      - name: Type check
        working-directory: graphrefly-py
        run: uv run mypy src

      - name: API docs coverage
        working-directory: graphrefly-py
        run: uv run python scripts/check_api_docs.py

      - name: Generated docs freshness
        working-directory: graphrefly-py
        run: pnpm --dir website docs:gen:check

      - name: Build docs
        working-directory: graphrefly-py
        run: pnpm --dir website build
