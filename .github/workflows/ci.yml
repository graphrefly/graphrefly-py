name: CI

on:
  push:
    branches:
      - d797-kernel-migration
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Python host package
        uses: actions/checkout@v7
        with:
          path: graphrefly-py

      - name: Checkout canonical protocol fixtures
        uses: actions/checkout@v7
        with:
          repository: graphrefly/graphrefly
          ref: f2e23490bafe94745f720da3ced5f0fff6fccd65
          path: graphrefly
          sparse-checkout: spec/fixtures

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Enable Corepack (pnpm)
        working-directory: graphrefly-py/website
        run: |
          corepack enable
          corepack install

      - name: Sync dependencies
        working-directory: graphrefly-py
        run: uv sync --group dev --group docs

      - name: Install docs website dependencies
        working-directory: graphrefly-py/website
        run: pnpm install --frozen-lockfile

      - name: Test
        working-directory: graphrefly-py
        run: uv run pytest

      - name: Compare shared protocol probes
        working-directory: graphrefly-py
        run: PYTHONPATH=src uv run python scripts/probe_rereview.py ../graphrefly/spec/fixtures/d797-rereview.v1.json

      - name: Compare shared module naming probes
        working-directory: graphrefly-py
        run: PYTHONPATH=src uv run python scripts/probe_naming.py ../graphrefly/spec/fixtures/node-naming.v1.json

      - name: Test optional async runtime adapters
        working-directory: graphrefly-py
        run: uv run --with 'trio>=0.25' --with 'anyio>=4.0' pytest tests/test_async_runner_real_runtime.py

      - name: Lint
        working-directory: graphrefly-py
        run: uv run ruff check .

      - name: Type check
        working-directory: graphrefly-py
        run: uv run mypy src

      - name: Build the pure-Python wheel and sdist
        working-directory: graphrefly-py
        run: uv build

      - name: API docs coverage
        working-directory: graphrefly-py
        run: uv run python scripts/check_api_docs.py

      - name: Generated docs freshness
        working-directory: graphrefly-py/website
        run: pnpm docs:gen:check

      - name: Build docs
        working-directory: graphrefly-py/website
        run: pnpm build
