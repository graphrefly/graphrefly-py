name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the built artifacts to PyPI"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  release-please:
    name: Release PR
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
    steps:
      - name: Create GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.GRAPHREFLY_WRITE_CONTENT_APP_CLIENT_ID }}
          private-key: ${{ secrets.GRAPHREFLY_WRITE_CONTENT_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - name: Create Release PR or GitHub Release
        id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  test:
    needs: release-please
    if: ${{ always() && (github.event_name == 'workflow_dispatch' || needs.release-please.outputs.release_created == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Python package
        uses: actions/checkout@v7
        with:
          path: graphrefly-py

      - name: Checkout canonical protocol fixtures
        uses: actions/checkout@v7
        with:
          repository: graphrefly/graphrefly
          ref: e39c54d20827003393d3823a3e95c0b86d120aee
          path: graphrefly
          sparse-checkout: spec/fixtures/protobuf

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2

      - name: Sync dependencies
        working-directory: graphrefly-py
        run: uv sync --group dev

      - name: Test
        working-directory: graphrefly-py
        run: uv run pytest

      - name: Test optional async runtime adapters
        working-directory: graphrefly-py
        run: uv run --with 'trio>=0.25' --with 'anyio>=4.0' pytest tests/test_async_runner_real_runtime.py

      - name: Lint
        working-directory: graphrefly-py
        run: uv run ruff check .

      - name: Type check
        working-directory: graphrefly-py
        run: uv run mypy src

  build:
    name: Build wheel and sdist
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout Python package
        uses: actions/checkout@v7
        with:
          path: graphrefly-py

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2

      - name: Build
        working-directory: graphrefly-py
        run: uv build --out-dir dist

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: graphrefly-py/dist/*

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [release-please, build]
    if: ${{ always() && needs.build.result == 'success' && ((github.event_name == 'workflow_dispatch' && inputs.publish == true) || needs.release-please.outputs.release_created == 'true') }}
    permissions:
      contents: read
      id-token: write
    environment: pypi
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
