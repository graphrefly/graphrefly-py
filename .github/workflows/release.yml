name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the built artifacts to PyPI"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  release-please:
    name: Release PR
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
    steps:
      - name: Create GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.GRAPHREFLY_WRITE_CONTENT_APP_CLIENT_ID }}
          private-key: ${{ secrets.GRAPHREFLY_WRITE_CONTENT_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - name: Create Release PR or GitHub Release
        id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  test:
    needs: release-please
    if: ${{ always() && (github.event_name == 'workflow_dispatch' || needs.release-please.outputs.release_created == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Python host package
        uses: actions/checkout@v7
        with:
          path: graphrefly-py

      - name: Checkout Rust native engine
        uses: actions/checkout@v7
        with:
          repository: graphrefly/graphrefly-rs
          ref: main
          path: graphrefly-rs

      - name: Checkout authority fixtures
        uses: actions/checkout@v7
        with:
          repository: graphrefly/graphrefly
          ref: main
          path: graphrefly

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2

      - name: Sync dependencies
        working-directory: graphrefly-py
        run: uv sync --group dev

      - name: Build native extension
        working-directory: graphrefly-py
        run: uv run maturin develop --release

      - name: Test
        working-directory: graphrefly-py
        run: uv run pytest

      - name: Test optional async runtime adapters
        working-directory: graphrefly-py
        run: uv run --with 'trio>=0.25' --with 'anyio>=4.0' pytest tests/test_async_runner_real_runtime.py

      - name: Lint
        working-directory: graphrefly-py
        run: uv run ruff check .

      - name: Type check
        working-directory: graphrefly-py
        run: uv run mypy src

  wheels:
    name: Wheels (${{ matrix.platform.name }})
    runs-on: ${{ matrix.platform.runner }}
    needs: test
    continue-on-error: ${{ matrix.platform.experimental == true }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: linux-x86_64
            runner: ubuntu-22.04
            target: x86_64
            python_arch: x64
            interpreter: python3.12
            manylinux: "2014"
          - name: linux-aarch64
            runner: ubuntu-22.04
            target: aarch64
            python_arch: x64
            interpreter: python3.12
            manylinux: "2014"
          - name: musllinux-x86_64
            runner: ubuntu-22.04
            target: x86_64
            python_arch: x64
            interpreter: python3.12
            manylinux: musllinux_1_2
          - name: musllinux-aarch64
            runner: ubuntu-22.04
            target: aarch64
            python_arch: x64
            interpreter: python3.12
            manylinux: musllinux_1_2
          - name: macos-x86_64
            runner: macos-15-intel
            target: x86_64
            python_arch: x64
            interpreter: python3.12
          - name: macos-arm64
            runner: macos-latest
            target: aarch64
            python_arch: arm64
            interpreter: python3.12
          - name: windows-x64
            runner: windows-latest
            target: x64
            python_arch: x64
            interpreter: python
          - name: windows-arm64
            runner: windows-11-arm
            target: aarch64
            python_arch: arm64
            interpreter: python
            experimental: true
    steps:
      - name: Checkout Python host package
        uses: actions/checkout@v7
        with:
          path: graphrefly-py

      - name: Checkout Rust native engine
        uses: actions/checkout@v7
        with:
          repository: graphrefly/graphrefly-rs
          ref: main
          path: graphrefly-rs

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          architecture: ${{ matrix.platform.python_arch }}

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          working-directory: graphrefly-py
          target: ${{ matrix.platform.target }}
          args: --release --out dist --interpreter ${{ matrix.platform.interpreter }}
          manylinux: ${{ matrix.platform.manylinux || 'auto' }}
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}

      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.platform.name }}
          path: graphrefly-py/dist/*.whl

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [release-please, wheels]
    if: ${{ always() && needs.wheels.result == 'success' && ((github.event_name == 'workflow_dispatch' && inputs.publish == true) || needs.release-please.outputs.release_created == 'true') }}
    permissions:
      contents: read
      id-token: write
    environment: pypi
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
