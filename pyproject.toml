[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "graphrefly"
version = "0.23.0"
description = "GraphReFly for Python: a reactive graph on its own pure-Python kernel."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "David Chen" }]
keywords = ["reactive", "graph", "signals", "state-management"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://py.graphrefly.dev/"
Repository = "https://github.com/graphrefly/graphrefly-py"
Documentation = "https://py.graphrefly.dev/"
Spec = "https://graphrefly.dev/spec/"

[project.optional-dependencies]
async = [
    "anyio>=4.14",
    "trio>=0.33",
]

[dependency-groups]
dev = [
    "mypy>=2.1",
    "pytest>=9.1",
    "ruff>=0.15",
]
docs = [
    "griffe>=2.1.0",
]

[tool.uv]
# uv manages the environment only; the package is built with hatchling (uv build) and
# tests import it from src (pytest pythonpath).
package = false

[tool.hatch.build.targets.wheel]
packages = ["src/graphrefly"]

[tool.hatch.build.targets.sdist]
include = ["src/graphrefly", "README.md", "LICENSE", "CHANGELOG.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
strict = true
warn_return_any = true
warn_unused_configs = true
